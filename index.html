<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mリーグドラフト</title>

    <link rel="stylesheet" href="style.css">
</head>

<button id="logoutButton">
    ログアウト
</button>

<body>

    <main class="container">

        <h1>🏆 Mリーグドラフト</h1>

        <!-- ========================================
             ゲーム名
        ======================================== -->

        <section class="card game-info-card">

            <label
                for="gameNameInput"
                class="game-name-label"
            >
                大会名
            </label>

            <div class="game-name-row">

                <input
                    type="text"
                    id="gameNameInput"
                    placeholder="例：2026-27 Mリーグドラフト大会"
                    maxlength="100"
                >

                <button id="saveGameNameButton">
                    保存
                </button>

            </div>

            <p
                id="gameNameDisplay"
                class="game-name-display"
            >
                Mリーグドラフト
            </p>

        </section>

        <section class="card">

            <h2>大会</h2>

            <select
                id="tournamentSelect"
                class="tournament-select"
            >
                <option value="">
                    大会を選択してください
                </option>
            </select>

            <div class="tournament-create-row">
                <input
                    type="text"
                    id="newTournamentName"
                    class="tournament-create-input"
                    placeholder="新しい大会名"
                >

                <button id="createTournamentButton">
                    ＋ 新しい大会を作成
                </button>
            </div>

            <button
                id="deleteTournamentButton"
                class="tournament-delete-button"
            >
                🗑 この大会を削除
            </button>

            <p id="tournamentMessage"></p>

            <hr>

            <h3>大会への招待</h3>

            <p>
                招待コード：
                <strong id="currentInviteCode">
                    -
                </strong>

                <button id="copyInviteCodeButton">
                    コピー
                </button>
            </p>

            <hr>

            <h3>大会に参加</h3>

            <div class="tournament-create-row">
                <input
                    type="text"
                    id="joinTournamentCode"
                    class="tournament-create-input"
                    placeholder="招待コードを入力"
                >

                <button id="joinTournamentButton">
                    招待コードで参加
                </button>
            </div>

            <p id="joinTournamentMessage"></p>

        </section>

        <p class="description">
            4人の選手をドラフトして、シーズン終了時のポイントを競おう！
        </p>

        <div id="rankingArea"></div>

        <!-- ========================================
             参加者
        ======================================== -->

        <section class="card">

            <h2>参加者</h2>

            <div class="participant-add-row">

                <input
                    type="text"
                    id="participantName"
                    placeholder="参加者名を入力"
                >

                <button id="addParticipantButton">
                    参加者を追加
                </button>

            </div>

            <div id="participantList"></div>

        </section>

    </main>


    <!-- ========================================
         バックアップ復元用
    ======================================== -->

    <input
        type="file"
        id="restoreFileInput"
        accept=".json,application/json"
        hidden
    >


    <script type="module" src="app.js"></script>

</body>
</html>
