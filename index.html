<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mリーグドラフト</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card" id="loginCard">

    <h2>ログイン</h2>

    <div>
        <input
            type="email"
            id="loginEmail"
            placeholder="メールアドレス"
        >
    </div>

    <div>
        <input
            type="password"
            id="loginPassword"
            placeholder="パスワード"
        >
    </div>

    <button id="loginButton">
        ログイン
    </button>

    <p id="loginMessage"></p>

</section>

        <h1>🏆 Mリーグドラフト</h1>

        <!-- ========================================
             ゲーム名
        ======================================== -->

        <section class="card game-info-card">

            <label
                for="gameNameInput"
                class="game-name-label"
            >
                ゲーム名・大会名
            </label>

            <div class="game-name-row">

                <input
                    type="text"
                    id="gameNameInput"
                    placeholder="例：2026-27 Mリーグドラフト大会"
                    maxlength="100"
                >

                <button id="saveGameNameButton">
                    保存
                </button>

            </div>

            <p
                id="gameNameDisplay"
                class="game-name-display"
            >
                Mリーグドラフト
            </p>

        </section>


        <p class="description">
            4人の選手をドラフトして、シーズン終了時のポイントを競おう！
        </p>


        <!-- ========================================
             参加者
        ======================================== -->

        <section class="card">

            <h2>参加者</h2>

            <div class="participant-add-row">

                <input
                    type="text"
                    id="participantName"
                    placeholder="参加者名を入力"
                >

                <button id="addParticipantButton">
                    参加者を追加
                </button>

            </div>

            <div id="participantList"></div>

        </section>

    </main>


    <!-- ========================================
         バックアップ復元用
    ======================================== -->

    <input
        type="file"
        id="restoreFileInput"
        accept=".json,application/json"
        hidden
    >


    <script type="module" src="app.js"></script>

</body>
</html>
