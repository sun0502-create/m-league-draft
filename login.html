<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mリーグ大会管理 - ログイン</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #loginMessage {
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Mリーグ大会管理</h1>

        <div class="form-group">
            <label for="loginEmail">
                メールアドレス
            </label>

            <input
                id="loginEmail"
                type="email"
                autocomplete="email"
            >
        </div>

        <div class="form-group">
            <label for="loginPassword">
                パスワード
            </label>

            <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
            >
        </div>

        <button id="loginButton">
            ログイン
        </button>

        <div id="loginMessage"></div>

    </div>

    <script
        type="module"
        src="/login.js"
    ></script>

</body>

</html>
